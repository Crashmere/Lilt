# Business routes inherit ServerPortal authentication and cookie renewal.
location = /lilt { return 308 /lilt/$is_args$args; }
location ^~ /lilt/ {
    proxy_pass http://127.0.0.1:18089;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_next_upstream off;
    proxy_redirect off;

    location ~ ^/lilt/(?:favicon\.svg|apple-touch-icon\.png|icon-192\.png|icon-512\.png|manifest\.webmanifest)$ {
        auth_request off;
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:18089;
    }

    location ~ "^/lilt/api/uploads/u_[0-9a-f]{32}$" {
        client_max_body_size 33m;
        client_body_timeout 660s;
        proxy_request_buffering off;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
        proxy_pass http://127.0.0.1:18089;
    }

    location ~ "^/lilt/api/tracks/t_[0-9a-f]{32}/cover$" {
        client_max_body_size 0;
        client_body_timeout 660s;
        proxy_request_buffering off;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
        proxy_pass http://127.0.0.1:18089;
    }

    location ~ "^/lilt/api/tracks/t_[0-9a-f]{32}/(?:stream|download)$" {
        proxy_buffering off;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
        proxy_pass http://127.0.0.1:18089;
    }

    location ~ "^/lilt/api/mvs/m_[0-9a-f]{32}/(?:stream|download)$" {
        proxy_buffering off;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
        proxy_pass http://127.0.0.1:18089;
    }
}
